# experiments/config.yaml
# Shared configuration for all experiment scripts.

grid:
  x_min: -10.0
  x_max:  10.0
  n_points: 201
  grid_type: tanh
  refinement_point: 0.0   # cluster near q=0 (zero inventory)
  concentration: 3.0

time:
  T: 1.0
  n_steps: 200

solver:
  tol: 1.0e-6
  max_iter: 100
  damping: 0.5
  theta: 1.0          # fully implicit time stepping

model:
  type: avellaneda_stoikov
  sigma: 0.3
  gamma: 0.1
  Lambda0: 1.0
  kappa: 1.5
  A: 0.5

calibration:
  param_names: [sigma, gamma, kappa]
  param_bounds: [[0.05, 2.0], [0.01, 1.0], [0.5, 5.0]]
  max_iter: 300
  method: Nelder-Mead
