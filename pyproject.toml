[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mfg-lob"
version = "0.1.0"
description = "Mean-field game solver and analysis toolkit for limit order book models"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = ["mean-field games", "limit order book", "PDE", "HJB", "Fokker-Planck", "mathematical finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=1.5",
    "seaborn>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]
examples = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
]
accelerated = [
    "numba>=0.57",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mfg_lob*", "mfglob*", "data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
